<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="snowflakes"></div>
    <canvas id="lightning-bolts"></canvas>

    <div class="panel">
        <div class="top-panel">
            <nav class="nav-bar">
                <a href="#" class="nav-item active" data-target="home">Home</a>
                <a href="#" class="nav-item" data-target="rules">Rules</a>
                <a href="#" class="nav-item" data-target="team">Team</a>
            </nav>
    
            <header class="header">
                <div class="header-text">
                    <h1 id="header-title"></h1>
                    <p id="heater-description"></p>
                </div>
                <div class="header-icon" id="header-icon" style="visibility: hidden;"><img src=""></div>
            </header>
    
            <div class="main-container" id="main-container" style="visibility: hidden;">
                <div class="team-section" id="team-section" style="display: none;"></div>
                <div class="rules-section" id="rules-section" style="display: none;"></div>
            </div>
        </div>

        <div class="socials">
            <div class="discord-invite">
                <img src="assets/discord_icon.png" id="server-icon">
                <div class="discord-info">
                    <h2 id="discord-name"></h2>
                    <div class="discord-status">
                        <div class="online-status">
                            <span class="online-dot"></span> <span id="online-count-value"></span>
                        </div>
                        <div class="member-status">
                            <span class="member-dot"></span> <span id="member-count-value"></span>
                        </div>
                    </div>
                </div>
                <button class="join-btn" id="join-server">Join Server</button>
            </div>
            <div class="social-buttons" id="social-buttons"></div>
        </div>
    </div>

    <div class="music-player">
        <div class="music-visualizer">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
        <div class="music-info">
            <h2 class="music-title" id="title"></h2>
            <p class="music-artist" id="artist"></p>
        </div>
        <div class="music-controls">
            <svg  xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-player-track-prev"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M21 5v14l-8 -7z" /><path d="M10 5v14l-8 -7z" /></svg>
            <svg  xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-player-play"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M7 4v16l13 -8z" /></svg>
            <svg  xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-player-track-next"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M3 5v14l8 -7z" /><path d="M14 5v14l8 -7z" /></svg>
        </div>
    </div>
    
    <div class="player-profile" id="player-profile" style="display: none;">
        <div class="profile-header">
            <img src="" id="profile-picture" class="profile-picture">
            <div class="profile-info">
                <h3 class="username" id="username"></h3>
                <p class="member-since" id="member-since">Member Since:</p>
            </div>
            <button class="analytics-button" id="toggle-analytics">Show Analytics Graph</button>
        </div>
        <div class="stats">
            <div class="stat-card">
                <svg class="stat-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0" /><path d="M12 7v5l3 3" /></svg>
                <div class="stat-info">
                    <span class="stat-title">Playtime:</span>
                    <span class="stat-value" id="playtime"></span>
                </div>
            </div>

            <div class="stat-card">
                <svg class="stat-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 19l15 -15l3 3l-6 6l2 2a14 14 0 0 1 -14 4" /> </svg>
                <div class="stat-info">
                    <span class="stat-title">Kills:</span>
                    <span class="stat-value" id="kills"></span>
                </div>
            </div>
            
            <div class="stat-card">
                <svg class="stat-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 16.17v-9.17a3 3 0 0 1 3 -3h4a3 3 0 0 1 3 3v9.171" /><path d="M12 7v5" /><path d="M10 9h4" /><path d="M5 21v-2a3 3 0 0 1 3 -3h8a3 3 0 0 1 3 3v2h-14z" /></svg>
                <div class="stat-info">
                    <span class="stat-title">Deaths:</span>
                    <span class="stat-value" id="deaths"></span>
                </div>
            </div>

            <div class="stat-card">
                <svg class="stat-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 9h8" /><path d="M8 13h6" /><path d="M18 4a3 3 0 0 1 3 3v8a3 3 0 0 1 -3 3h-5l-5 3v-3h-2a3 3 0 0 1 -3 -3v-8a3 3 0 0 1 3 -3h12z" /></svg>
                <div class="stat-info">
                    <span class="stat-title">Chat Messages:</span>
                    <span class="stat-value" id="messages"></span>
                </div>
            </div>
        
            <div class="stat-card">
                <svg class="stat-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 13m0 2a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v4a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2z" /><path d="M17 17l0 .01" /><path d="M13 17l0 .01" /><path d="M15 13l0 -2" /><path d="M11.75 8.75a4 4 0 0 1 6.5 0" /><path d="M8.5 6.5a8 8 0 0 1 13 0" /></svg>
                <div class="stat-info">
                    <span class="stat-title">Connections:</span>
                    <span class="stat-value" id="connections"></span>
                </div>
            </div>
        </div>
        <div class="chart-container" id="chart-container" style="display: none;">
            <canvas id="chart"></canvas>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>

</body>
</html>
